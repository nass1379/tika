name: Tache 2 - tika-core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install reactor prerequisites
        run: >-
          ./mvnw -B -ntp -pl tika-core -am install -DskipTests
          -Drat.skip=true -Dcheckstyle.skip=true -Dossindex.skip=true
      - name: Run original, generated and manual tests
        run: >-
          ./mvnw -B -ntp -pl tika-core -Pchatunitest-verify clean test
          -Drat.skip=true -Dcheckstyle.skip=true -Dossindex.skip=true
      - name: Save Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tika-core-surefire-reports
          path: tika-core/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

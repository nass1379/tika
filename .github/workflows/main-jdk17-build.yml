name: main jdk17 build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        id: build_maven
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      - name: Rickroll si échec du build
        if: ${{ failure() && steps.build_maven.outcome == 'failure' }}
        uses: ./.github/actions/rickroll

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run E2E Tests
        id: e2e
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      - name: Rickroll si échec des tests E2E
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: ./.github/actions/rickroll
  
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Choisir la version à comparer
        id: reference
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            git fetch origin main
            BASE=$(git merge-base HEAD FETCH_HEAD)
          fi
          echo "Commit de référence : $BASE"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
      - name: Installer Semgrep
        run: pip install semgrep
      - name: Analyser les nouvelles vulnérabilités
        shell: bash
        env:
          BASE: ${{ steps.reference.outputs.base }}
        run: |
          semgrep scan --config p/java \
            --baseline-commit "$BASE" \
            --metrics=off \
            --json \
            --output semgrep-resultat.json \
            --error
      - name: Sauvegarder le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-semgrep
          path: semgrep-resultat.json
          if-no-files-found: warn
